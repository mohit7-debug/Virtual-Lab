<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Lab | Interactive Prototype</title>
<style>
:root{--navy:#12315a;--blue:#1264cf;--bg:#f5f8fc;--line:#dfe7f1;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172b45;font:15px/1.5 Inter,system-ui,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 14px}.brand{font-weight:800;font-size:20px;margin:4px 8px 28px}.brand span{display:block;font-size:10px;color:#a9cafa;letter-spacing:1px}.nav{display:block;width:100%;text-align:left;color:#dbeafe;border:0;background:none;padding:12px;border-radius:9px;margin:4px 0}.nav.active,.nav:hover{background:#2465b7;color:white}.side small{display:block;margin-top:60px;color:#a9cafa}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px}.content{padding:24px;max-width:1400px;margin:auto}.banner{background:linear-gradient(110deg,#dff2ff,#eef5ff);border:1px solid #c8e0fb;padding:26px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:20px}.banner h1{font-size:clamp(23px,3vw,34px);color:var(--navy);margin:8px 0}.banner .art{font-size:66px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0 24px}.card,.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #102b4b08}.stat strong{font-size:27px;display:block;color:var(--navy);margin:6px 0}.subject{padding:18px;border-radius:12px;min-height:150px}.btn{border:0;border-radius:8px;background:var(--blue);color:white;padding:10px 15px;font-weight:700;font-size:13px}.btn:hover{background:#084da9}.outline{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:9px 13px;font-size:13px}.chip{display:inline-block;padding:4px 9px;border-radius:20px;background:#eff6ff;color:#1d4ed8;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.exp{display:flex;flex-direction:column;gap:10px}.exp h3{margin:0}.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:23px}.field{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0 14px}.progress{height:8px;background:#e2e8f0;border-radius:30px;overflow:hidden}.progress span{display:block;height:100%;background:#2878e4}.table{border-collapse:collapse;width:100%;font-size:13px}.table td,.table th{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}.table th{color:var(--muted)}.notice{padding:12px;border-radius:9px;background:#ecfdf5;color:#047857;margin:12px 0}.hidden{display:none}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{padding:10px;display:flex;flex-wrap:wrap;gap:3px}.brand{width:100%;margin:5px 8px 12px}.nav{width:auto;flex:1;padding:9px;font-size:12px}.side small{display:none}.content{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:12px}.banner{padding:18px}.banner .art{font-size:42px}}
@media(max-width:480px){.grid,.stats{grid-template-columns:1fr}.top{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">⚗ Virtual Lab<span>EXPLORE · LEARN · DISCOVER</span></div>
<button class="nav active" data-page="Dashboard">⌂ &nbsp; Dashboard</button><button class="nav" data-page="Experiments">⚗ &nbsp; Experiments</button><button class="nav" data-page="Instructions">☷ &nbsp; Instructions</button><button class="nav" data-page="Simulation">◉ &nbsp; Simulation</button><button class="nav" data-page="Results">▤ &nbsp; Results</button><button class="nav" data-page="My Progress">◴ &nbsp; My Progress</button><button class="nav" data-page="Profile">♙ &nbsp; Profile</button>
<small>SY B.Tech · Software Engineering<br>Academic Year 2026–27</small></aside>
<div class="main"><header class="top"><strong>Learning Workspace / <span id="crumb">Dashboard</span></strong><span>● Demo mode &nbsp; | &nbsp; <b>Mohit Gupta</b></span></header><main id="content" class="content"></main></div>
</div>
<script>
const experiments=[
{id:'ohm',name:"Ohm's Law",subject:'Physics',icon:'⚡',color:'#dbeafe',ink:'#1d4ed8',desc:'Explore the relationship between voltage, current and resistance.',objective:'Verify Ohm’s law: V = I × R.',steps:['Set the resistance value.','Adjust the voltage supply.','Run the simulation and observe current.','Compare readings using V = I × R.']},
{id:'projectile',name:'Projectile Motion',subject:'Physics',icon:'🎯',color:'#e0f2fe',ink:'#0369a1',desc:'Explore how launch angle affects a projectile trajectory.',objective:'Observe how angle and speed affect the path of a launched object.',steps:['Choose an initial speed.','Set the launch angle.','Run the simulation.','Compare the estimated range.']},
{id:'titration',name:'Acid–Base Titration',subject:'Chemistry',icon:'🧪',color:'#d1fae5',ink:'#047857',desc:'Explore simulated neutralisation and pH.',objective:'Observe illustrative pH changes as base is added.',steps:['Start with the sample.','Add base in small increments.','Observe the simulated pH.','Record your observations.']},
{id:'bonding',name:'Chemical Bonding',subject:'Chemistry',icon:'⚛',color:'#d1fae5',ink:'#047857',desc:'Learn how atoms form ionic and covalent bonds.',objective:'Understand electron transfer and sharing.',steps:['Select a bond type.','Review the example atoms.','Inspect the conceptual model.','Record your observation.']},
{id:'binary',name:'Binary Search',subject:'Computer Science',icon:'⌘',color:'#ede9fe',ink:'#6d28d9',desc:'Find a target in a sorted array efficiently.',objective:'Understand how binary search repeatedly halves the search interval.',steps:['Review the sorted array.','Choose a target value.','Run the search.','Observe each comparison.']},
{id:'sorting',name:'Sorting Algorithm',subject:'Computer Science',icon:'↕',color:'#ede9fe',ink:'#6d28d9',desc:'Explore how an algorithm sorts a list of numbers.',objective:'Understand comparisons and ordering using bubble sort.',steps:['Review the starting array.','Run a pass at a time.','Watch adjacent values swap.','Check the sorted output.']}
];
let page='Dashboard',selected=experiments[0],filter='All',query='',completed=new Set(),runs=0,result=null,voltage=5,resistance=10,angle=45,speed=20,dose=0,target=23,trace=[];
const content=document.getElementById('content');const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stat(label,val,icon,sub){return `<div class="stat"><div class="row"><span class="muted">${label}</span><span>${icon}</span></div><strong>${val}</strong><div class="muted">${sub}</div></div>`}
function bar(n,color='#2878e4'){return `<div class="progress"><span style="width:${n}%;background:${color}"></span></div>`}
function expCard(e){return `<article class="card exp"><div class="row"><div class="icon" style="background:${e.color};color:${e.ink}">${e.icon}</div><span class="chip">${e.subject}</span></div><h3>${e.name}</h3><p class="muted">${e.desc}</p><button class="btn" data-open="${e.id}">Open experiment →</button></article>`}
function dashboard(){return `<section class="banner"><div><span class="chip">YOUR DIGITAL SCIENCE LAB</span><h1>Hello, Mohit Gupta! 👋</h1><p class="muted">Explore experiments. Practice skills. Learn by doing.</p><button class="btn" data-page="Experiments">Explore Experiments →</button></div><div class="art">🔬</div></section><div class="grid stats">${stat('Total experiments',experiments.length,'⚗','Across 3 subjects')}${stat('Completed',completed.size,'✓','Experiments finished')}${stat('Simulations run',runs,'◴','Practice sessions')}</div><div class="row"><h2>Explore by subject</h2><button class="outline" data-page="Experiments">View all →</button></div><div class="grid">${[['Physics','⚛','#dbeafe','#1d4ed8','Laws, forces and motion'],['Chemistry','🧪','#d1fae5','#047857','Reactions and molecular science'],['Computer Science','⌘','#ede9fe','#6d28d9','Algorithms and coding']].map(a=>`<div class="subject" style="background:${a[2]};color:${a[3]}"><div style="font-size:28px">${a[1]}</div><h3>${a[0]}</h3><p class="muted">${a[4]}</p><button class="outline" data-filter="${a[0]}">Browse labs →</button></div>`).join('')}</div><h2 style="margin-top:25px">Recommended experiments</h2><div class="grid">${experiments.slice(0,3).map(expCard).join('')}</div>`}
function library(){let arr=experiments.filter(e=>(filter==='All'||e.subject===filter)&&(e.name+' '+e.subject+' '+e.desc).toLowerCase().includes(query.toLowerCase()));return `<h1>Experiment Library</h1><p class="muted">Choose a subject and open an experiment to view instructions and try its simulation.</p><div class="card" style="margin:16px 0"><input class="field" id="search" placeholder="Search experiments..." value="${esc(query)}"><div class="row" style="justify-content:flex-start">${['All','Physics','Chemistry','Computer Science'].map(s=>`<button class="${filter===s?'btn':'outline'}" data-filter="${s}">${s}</button>`).join('')}</div></div><div class="grid">${arr.map(expCard).join('')||'<div class="card">No experiments match your search.</div>'}</div>`}
function instructions(){return `<button class="outline" data-page="Experiments">← Experiment library</button><div class="card" style="margin-top:15px"><div class="row" style="justify-content:flex-start"><div class="icon" style="background:${selected.color};color:${selected.ink};width:56px;height:56px">${selected.icon}</div><div><span class="chip">${selected.subject}</span><h1 style="margin:5px 0">${selected.name}</h1></div></div><div class="grid" style="margin-top:20px"><div><h3>Objective</h3><p class="muted">${selected.objective}</p><h3>Virtual apparatus</h3><p class="muted">${selected.subject==='Physics'?'Virtual circuit, controls and graph':selected.subject==='Chemistry'?'Simulated chemicals and indicators':'Interactive array and algorithm trace'}</p></div><div><h3>Procedure</h3><ol>${selected.steps.map(s=>`<li style="margin:10px 0">${s}</li>`).join('')}</ol><p class="muted">This is a digital educational simulation, not a physical laboratory.</p></div></div><button class="btn" data-page="Simulation">Start simulation →</button></div>`}
function graph(){let pts=[];for(let i=0;i<=10;i++)pts.push(`${30+i*25},${125-i*9*voltage/5}`);return `<svg viewBox="0 0 300 155" style="width:100%;max-height:200px"><path d="M30 10V130H285" stroke="#94a3b8" fill="none"/><path d="M30 40H285 M30 70H285 M30 100H285" stroke="#e2e8f0"/><polyline points="${pts.join(' ')}" fill="none" stroke="#2563eb" stroke-width="3"/><text x="125" y="150" font-size="10" fill="#64748b">Current (A)</text></svg>`}
function simulation(){let e=selected,controls='',visual='',readings='';if(e.id==='ohm'){controls=`<label class="muted">Resistance: <b id="rv">${resistance} Ω</b></label><input class="field" id="r" type="range" min="1" max="50" value="${resistance}"><label class="muted">Voltage: <b id="vv">${voltage.toFixed(1)} V</b></label><input class="field" id="v" type="range" min="1" max="12" step=".5" value="${voltage}">`;visual=`<svg viewBox="0 0 320 150" style="width:100%"><path d="M30 35H110l10 -10 12 20 12 -20 12 20 12 -20 12 10H290V120H30V35" fill="none" stroke="#334155" stroke-width="2.5"/><circle cx="65" cy="35" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="65" y="40" text-anchor="middle" fill="#1d4ed8">V</text><circle cx="290" cy="75" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="290" y="80" text-anchor="middle" fill="#1d4ed8">A</text><text x="160" y="12" text-anchor="middle">${resistance} Ω</text></svg>`;readings=`<div class="grid">${stat('Voltage',voltage.toFixed(1)+' V','⚡','Supply')}${stat('Current',(voltage/resistance).toFixed(3)+' A','↗','V ÷ R')}${stat('Resistance',resistance+' Ω','⌁','V = I × R')}</div><div class="card" style="margin-top:12px"><h3>Voltage vs Current</h3>${graph()}</div>`}
else if(e.id==='projectile'){let rad=angle*Math.PI/180,range=speed*speed*Math.sin(2*rad)/9.81,height=speed*speed*Math.sin(rad)**2/(2*9.81),pts=[];for(let i=0;i<=30;i++){let t=i/30*2*speed*Math.sin(rad)/9.81,x=speed*Math.cos(rad)*t,y=speed*Math.sin(rad)*t-4.905*t*t;pts.push(`${15+x/Math.max(range,1)*270},${130-y/Math.max(height,1)*105}`)}controls=`<label class="muted">Angle: <b id="av">${angle}°</b></label><input class="field" id="a" type="range" min="10" max="80" value="${angle}"><label class="muted">Speed: <b id="sv">${speed} m/s</b></label><input class="field" id="s" type="range" min="5" max="40" value="${speed}">`;visual=`<svg viewBox="0 0 300 150" style="width:100%"><path d="M10 130H290" stroke="#94a3b8"/><polyline points="${pts.join(' ')}" fill="none" stroke="#2563eb" stroke-width="3"/></svg>`;readings=`<div class="grid">${stat('Estimated range',range.toFixed(2)+' m','↔','Ideal model')}${stat('Peak height',height.toFixed(2)+' m','↗','Ideal model')}</div>`}
else if(e.id==='titration'){let ph=Math.min(14,2+dose*.12);controls=`<label class="muted">Base added: <b id="dv">${dose} mL</b></label><input class="field" id="d" type="range" min="0" max="100" value="${dose}">`;visual=`<div style="padding:25px;text-align:center"><div style="margin:auto;width:85px;height:115px;border:3px solid #94a3b8;border-radius:12px 12px 25px 25px;background:linear-gradient(to top,hsl(${ph*8},75%,65%) 70%,#fff 70%);display:grid;place-items:center;font-size:23px;font-weight:bold">${ph.toFixed(1)}</div><p class="muted">Illustrative pH indicator</p></div>`;readings=stat('Estimated pH',ph.toFixed(1),'🧪','Illustrative model')}
else {controls=`<label class="muted">Search target: <b id="tv">${target}</b></label><input class="field" id="t" type="range" min="1" max="30" value="${target}"><button class="outline" data-action="search">Run binary search</button>`;visual=`<div class="row" style="justify-content:center;margin:25px 0;gap:8px">${[1,4,8,12,17,23,27,30].map(n=>`<b style="padding:13px;background:${trace.includes(n)?'#bfdbfe':'#f1f5f9'};border-radius:8px">${n}</b>`).join('')}</div><p class="muted">Sorted array · ${trace.length} comparisons</p>`;readings=`<div class="card"><h3>Algorithm trace</h3><p class="muted">${trace.length?trace.join(' → '):'Run binary search to see midpoint comparisons.'}</p></div>`}
return `<button class="outline" data-page="Instructions">← Instructions</button><h1 style="margin-bottom:5px">${selected.name} — Simulation</h1><p class="muted">Adjust controls and observe simulated readings.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:16px"><div class="card"><h3>Simulation controls</h3>${controls}<button class="btn" data-action="run">▶ Run simulation</button> <button class="outline" data-action="reset">Reset</button></div><div class="card"><h3>Virtual apparatus</h3>${visual}</div></div><h2>Live readings</h2>${readings}<p class="muted">Prototype readings are simulated for learning and are not measurements from real equipment.</p>`}
function results(){return `<h1>Experiment Results</h1>${result?`<div class="card" style="margin-top:15px"><span class="chip">SIMULATION COMPLETE</span><h2>${result.name}</h2><p class="muted">${result.subject}</p><h3>Summary</h3><p>${result.summary}</p><h3>Conclusion</h3><p class="muted">${result.conclusion}</p><button class="btn" data-action="download">Download report</button> <button class="outline" data-page="Experiments">Try another experiment</button></div>`:`<div class="card" style="margin-top:15px"><p>No results yet. Run a simulation first.</p><button class="btn" data-page="Experiments">Choose an experiment</button></div>`}`}
function progressPage(){let pct=Math.round(completed.size/experiments.length*100);return `<h1>My Progress</h1><p class="muted">Track your learning across all three subjects.</p><div class="grid" style="margin-top:16px"><div class="card"><p class="muted">Overall completion</p><strong style="font-size:35px">${pct}%</strong>${bar(pct)}<p class="muted">${completed.size} of ${experiments.length} experiments completed</p></div>${['Physics','Chemistry','Computer Science'].map((s,i)=>{let es=experiments.filter(e=>e.subject===s),n=es.filter(e=>completed.has(e.id)).length;return `<div class="card"><h3>${s}</h3><strong>${n}/${es.length}</strong>${bar(n/es.length*100,['#2878e4','#059669','#7c3aed'][i])}<p class="muted">Experiments completed</p></div>`}).join('')}</div><div class="card" style="margin-top:16px"><h3>Experiment checklist</h3>${experiments.map(e=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${e.name}</b><div class="muted">${e.subject}</div></div><span class="chip" style="${completed.has(e.id)?'background:#d1fae5;color:#047857':''}">${completed.has(e.id)?'✓ Completed':'Not completed'}</span></div>`).join('')}</div>`}
function profile(){return `<h1>Student Profile</h1><div class="card" style="margin-top:16px"><div class="row" style="justify-content:flex-start"><div class="icon" style="background:#dbeafe;border-radius:50%">MG</div><div><h2 style="margin:0">Mohit Gupta</h2><p class="muted">SY B.Tech · Student demo account</p></div></div><p><b>Roll Number:</b> 69</p><p><b>Enrollment Number:</b> ADT25SOCB1750</p><p><b>Project:</b> Virtual Lab — Software Engineering</p><p class="muted">Sample profile details for a college demonstration. No server or account is connected.</p></div>`}
function render(){ $('crumb').textContent=page;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));content.innerHTML=page==='Dashboard'?dashboard():page==='Experiments'?library():page==='Instructions'?instructions():page==='Simulation'?simulation():page==='Results'?results():page==='My Progress'?progressPage():profile()}
function run(){runs++;completed.add(selected.id);if(selected.id==='ohm')result={name:selected.name,subject:selected.subject,summary:`Voltage ${voltage.toFixed(1)} V, resistance ${resistance} Ω, current ${(voltage/resistance).toFixed(3)} A.`,conclusion:'The simulation follows Ohm’s law: current equals voltage divided by resistance (I = V/R).'};else if(selected.id==='projectile')result={name:selected.name,subject:selected.subject,summary:`Launch speed ${speed} m/s at ${angle}°.`,conclusion:'Changing launch speed and angle changes the idealised trajectory.'};else if(selected.id==='titration')result={name:selected.name,subject:selected.subject,summary:`Illustrative base addition: ${dose} mL.`,conclusion:'The illustrative pH indicator changes as base is added; real results depend on chemical concentrations.'};else if(selected.id==='binary')result={name:selected.name,subject:selected.subject,summary:`Target ${target}. Midpoint comparisons: ${trace.join(' → ')||'run binary search to generate trace'}.`,conclusion:'Binary search narrows a sorted search interval with each comparison.'};else result={name:selected.name,subject:selected.subject,summary:'Completed the interactive conceptual model.',conclusion:selected.id==='bonding'?'The model introduces the difference between ionic and covalent bonding.':'The model introduces ordering through comparisons.'};page='Results';render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.filter){filter=['All','Physics','Chemistry','Computer Science'].includes(b.dataset.filter)?b.dataset.filter:b.dataset.filter;page='Experiments';render()}if(b.dataset.open){selected=experiments.find(x=>x.id===b.dataset.open);page='Instructions';render()}if(b.dataset.action==='run')run();if(b.dataset.action==='reset'){voltage=5;resistance=10;angle=45;speed=20;dose=0;trace=[];render()}if(b.dataset.action==='search'){let a=[1,4,8,12,17,23,27,30],lo=0,hi=7;trace=[];while(lo<=hi){let m=Math.floor((lo+hi)/2);trace.push(a[m]);if(a[m]===target)break;if(a[m]<target)lo=m+1;else hi=m-1}render()}if(b.dataset.action==='download'&&result){let text=`VIRTUAL LAB REPORT\nStudent: Mohit Gupta\nExperiment: ${result.name}\nSubject: ${result.subject}\n\nSummary: ${result.summary}\n\nConclusion: ${result.conclusion}\n\nEducational simulation only.`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='Virtual_Lab_Report.txt';a.click();URL.revokeObjectURL(a.href)}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){query=t.value;let pos=t.selectionStart;let cards=content.querySelector('.grid:last-child');if(cards){let arr=experiments.filter(x=>(filter==='All'||x.subject===filter)&&(x.name+' '+x.subject+' '+x.desc).toLowerCase().includes(query.toLowerCase()));cards.innerHTML=arr.map(expCard).join('')||'<div class="card">No experiments found.</div>'}}if(t.id==='r'){resistance=+t.value;render()}if(t.id==='v'){voltage=+t.value;render()}if(t.id==='a'){angle=+t.value;render()}if(t.id==='s'){speed=+t.value;render()}if(t.id==='d'){dose=+t.value;render()}if(t.id==='t'){target=+t.value;render()}});
render();
</script>
</body></html>
